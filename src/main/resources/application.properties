#############   MySQL Setup   ####################
spring.datasource.url=jdbc:mysql://localhost:3306/rate_sentinel?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#############   Redis Setup   ####################
# Redis Host & Port
spring.redis.host=localhost
spring.redis.port=6379

# Connection timeout
spring.redis.timeout=2000

# Lettuce pool config (default client)
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

#############   Kafka Setup   ####################
# Kafka Broker
spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.retries=3
spring.kafka.producer.properties.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Topics
kafka.topics.sms=sms
kafka.topics.email=email
kafka.topics.whatsapp=whatsapp
kafka.topics.payment=payment

#############   OTP values   ########################
otp.length=6
otp.expiry-seconds=300
otp.max-attempts=5
otp.lockout-seconds=900

#############   JWT values   ########################
jwt.secret=This-is-a-dummy-secret-0001-for-testing-purpose-only
jwt.expiration=3600000